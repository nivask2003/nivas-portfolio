<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Brand Gradient -->
    <linearGradient id="nkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Accent Dot Gradient -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.45"/>
    </filter>

    <style>
      .bg-rect {
        fill: #070b14;
        stroke: url(#nkGrad);
        stroke-width: 14;
        transition: fill 0.3s ease, stroke 0.3s ease;
      }
      .nk-path {
        fill: url(#nkGrad);
      }
      .nk-dot {
        fill: url(#dotGrad);
      }

      /* Light Mode Adaptive Support */
      @media (prefers-color-scheme: light) {
        .bg-rect {
          fill: #ffffff;
          stroke: url(#nkGrad);
          stroke-width: 18;
        }
      }
    </style>
  </defs>

  <!-- Background Squircle Container -->
  <rect class="bg-rect" x="32" y="32" width="448" height="448" rx="112" filter="url(#glow)" />

  <!-- Monogram "NK." Logo -->
  <g transform="translate(80, 330)">
    <!-- Letter N -->
    <path class="nk-path" d="M0 0 V-180 H36 L100 -50 V-180 H136 V0 H100 L36 -130 V0 Z" />
    <!-- Letter K -->
    <path class="nk-path" d="M165 0 V-180 H201 V-95 L260 -180 H305 L236 -82 L310 0 H262 L201 -70 V0 Z" />
    <!-- Dot '.' -->
    <circle class="nk-dot" cx="332" cy="-24" r="22" />
  </g>
</svg>
